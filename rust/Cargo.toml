[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/toapi-js/toapi"

[workspace.dependencies]
toapi-core = { path = "crates/toapi-core", version = "0.1.0" }
toapi-server = { path = "crates/toapi-server", version = "0.1.0" }
toapi-codegen = { path = "crates/toapi-codegen", version = "0.1.0" }
toapi-client = { path = "crates/toapi-client", version = "0.1.0" }

axum = "0.8"
bytes = "1"
futures = "0.3"
async-stream = "0.3"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
